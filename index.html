<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>APPME</title><style>body{margin:0;font-family:Arial;background:#0f172a;color:#fff}header,.footer{text-align:center;padding:30px;background:#111827}.hero{text-align:center;padding:80px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:20px}.card{background:#1e293b;padding:20px;border-radius:16px}.chat{margin:20px;background:#1e293b;padding:20px;border-radius:16px}input,textarea{width:100%;margin-top:10px;padding:10px;background:#334155;color:#fff;border:none;border-radius:10px}button{padding:10px 18px;margin-top:10px;background:#2563eb;color:#fff;border:none;border-radius:10px}</style></head><body><header><h1>APPME</h1><p>موقعي الرسمي</p></header><section class='hero'><h1>مرحبا بك</h1><p>تطبيقات وألعاب وفيديوهات</p></section><section class='grid'><div class='card'><h2>التطبيقات</h2></div><div class='card'><h2>الألعاب</h2></div><div class='card'><h2>الفيديوهات</h2></div><div class='card'><h2>الصور</h2></div></section><section class='chat'><h2>الدردشة</h2><input placeholder='اسمك'><textarea rows='4' placeholder='رسالتك'></textarea><button>إرسال</button></section><div class='footer'>APPME 2026</div><script>const p=prompt('كلمة المرور');if(p!=='appme2026'){document.body.innerHTML='<h1 style="text-align:center;margin-top:100px">Access Denied</h1>';}</script></body></html>
